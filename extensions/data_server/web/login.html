<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ログイン | MOSAdemy</title><link rel="stylesheet" href="/assets/app.css"></head><body><main><section class="card" style="max-width:420px;margin:10vh auto"><h1>MOSAdemy ログイン</h1><form id="form"><p><label>ユーザー名<br><input name="username" autocomplete="username" required></label></p><p><label>パスワード<br><input name="password" type="password" autocomplete="current-password" required></label></p><button>ログイン</button><p id="error" class="error" role="alert"></p></form></section></main><script src="/assets/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();error.textContent='';try{await api('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});location='/dashboard'}catch(x){error.textContent=x.error?.message||'ログインできません'}}</script></body></html>
