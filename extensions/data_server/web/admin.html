<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>管理 | MOSAdemy</title><link rel="stylesheet" href="/assets/app.css"></head><body><header><b>MOSAdemy 管理</b><nav><a href="/dashboard">ダッシュボード</a><a href="#" onclick="logout()">ログアウト</a></nav></header><main><h1>管理概要</h1><div id="stats" class="grid"><div class="card">読み込み中…</div></div><h2>管理メニュー</h2><div class="card">ユーザー / アプリケーション / 公開鍵 / 施設 / センサ / データ / import / 監査ログ / システム状態 / 設定</div></main><script src="/assets/app.js"></script><script>(async()=>{const u=await me();if(!u)return location='/login';try{const d=await api('/api/v1/admin/overview');stats.innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><div class="value">${v}</div><div class="muted">${k}</div></div>`).join('')}catch(e){stats.innerHTML='<div class="card error">管理者権限が必要です</div>'}})()</script></body></html>
