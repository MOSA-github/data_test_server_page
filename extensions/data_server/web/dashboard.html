<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ダッシュボード | MOSAdemy</title><link rel="stylesheet" href="/assets/app.css"></head><body><header><b>MOSAdemy Monitoring</b><nav><a href="/dashboard">ダッシュボード</a><a href="/admin">管理</a><a href="#" onclick="logout()">ログアウト</a></nav></header><main><h1>消費電力ダッシュボード</h1><p class="muted">正式フォーマット未提供のため、既存の瞬時電力（W）のみ表示します。電力量は算出しません。</p><div id="cards" class="grid"><div class="card">読み込み中…</div></div></main><script src="/assets/app.js"></script><script>async function load(){if(!await me())return location='/login';try{const d=await api('/api/v1/sensors/current');cards.innerHTML=d.map(x=>`<article class="card"><span class="status">${x.status}</span><h2>${x.room}</h2><div class="value">${Number(x.power_w).toLocaleString()} W</div><p class="muted">${x.id} · ${x.time}</p></article>`).join('')||'<div class="card">データがありません</div>'}catch(e){cards.innerHTML='<div class="card error">データを取得できません</div>'}}load();setInterval(load,10000)</script></body></html>
