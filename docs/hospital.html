<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>病院管理 | MOSAdemy Monitor</title><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/sensor-types.css">
</head>
<body data-page="hospital">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">M</span><span>MOSAdemy Monitor</span></a>
    <nav class="topnav"><a href="index.html">病院一覧</a><a href="admin.html">管理者画面</a></nav>
  </header>
  <main class="page-shell">
    <nav class="breadcrumb" aria-label="パンくず"><a href="index.html">病院一覧</a><span>/</span><span id="crumbName">病院</span></nav>
    <div class="facility-hero">
      <div><p id="hospitalId" class="eyebrow">FACILITY</p><h1 id="hospitalName">読み込み中</h1><p id="hospitalMeta" class="lead"></p></div>
      <span id="hospitalStatus" class="status-badge"></span>
    </div>
    <div class="tabs" role="tablist" aria-label="病院データ">
      <button class="tab active" data-tab="overview" role="tab">概要</button>
      <button class="tab" data-tab="water" role="tab">貯水・水位</button>
      <button class="tab" data-tab="power" role="tab">消費電力</button>
      <button class="tab" data-tab="generator" role="tab">発電機</button>
      <button class="tab" data-tab="camera" role="tab">カメラ</button>
    </div>
    <section id="overviewPanel" class="tab-panel">
      <div id="metricCards" class="metric-grid"></div>
      <div class="content-grid">
        <article class="panel"><div class="panel-heading"><h2>設備の状態</h2><span class="muted">最新値</span></div><div id="sensorSummary"></div></article>
        <article class="panel"><div class="panel-heading"><h2>施設情報</h2></div><dl id="facilityDetails" class="detail-list"></dl></article>
      </div>
    </section>
    <section id="waterPanel" class="tab-panel" hidden>
      <div class="panel"><div class="panel-heading"><div><h2>貯水・水位センサ</h2><p class="muted">貯水槽やタンクの水位情報</p></div></div><div id="waterCards" class="power-grid"></div></div>
    </section>
    <section id="powerPanel" class="tab-panel" hidden>
      <div class="panel"><div class="panel-heading"><div><h2>消費電力</h2><p class="muted">センサごとの最新値</p></div><span class="data-note">10秒ごとに更新</span></div><div id="powerCards" class="power-grid"></div></div>
    </section>
    <section id="generatorPanel" class="tab-panel" hidden>
      <div class="panel"><div class="panel-heading"><div><h2>発電機センサ</h2><p class="muted">非常用発電機の燃料残量・運転状態</p></div></div><div id="generatorCards" class="power-grid"></div></div>
    </section>
    <section id="cameraPanel" class="tab-panel" hidden>
      <div class="panel"><div class="panel-heading"><div><h2>監視カメラ</h2><p class="muted">この病院に登録されたカメラ</p></div></div><div id="cameraGrid" class="camera-grid"></div></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
