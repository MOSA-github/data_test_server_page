<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="MOSAdemy公開データの形式とエンドポイント">
  <title>公開データ | MOSAdemy</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="data">
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">M</span>MOSAdemy Data Platform</a>
    <nav aria-label="メインナビゲーション"><a href="data-guide.html" aria-current="page">公開データ</a><a href="svgmap-guide.html">SVGMap</a><a href="https://github.com/MOSA-github/data_test_server_page">GitHub</a></nav>
  </div></header>

  <main>
    <section class="page-intro" aria-labelledby="page-title"><p class="eyebrow">公開データ</p><h1 id="page-title">データカタログ</h1><p class="lead">形式 / エンドポイント / 更新 / 状態</p></section>

    <section class="section" aria-labelledby="catalog-title">
      <div class="section-heading"><div><p class="section-kicker">データセット</p><h2 id="catalog-title">公開データ</h2></div><span class="count" id="datasetCount">—件</span></div>
      <div class="table-shell"><table class="dataset-table"><thead><tr><th>データセット</th><th>形式</th><th>エンドポイント</th><th>更新</th><th>状態</th></tr></thead><tbody id="datasetRows"><tr><td colspan="5" class="loading-state">カタログを読み込み中</td></tr></tbody></table></div>
      <div id="datasetEmpty" class="empty-state" hidden><strong>公開データなし</strong><span>公開データ準備中</span></div>
    </section>

    <section class="section" aria-labelledby="rules-title">
      <div class="section-heading"><div><p class="section-kicker">データ規約</p><h2 id="rules-title">共通ルール</h2></div></div>
      <div class="table-shell"><table><thead><tr><th>項目</th><th>仕様</th></tr></thead><tbody>
        <tr><td><code>日時</code></td><td>ISO 8601 / タイムゾーン必須</td></tr>
        <tr><td><code>緯度</code></td><td>-90〜90</td></tr>
        <tr><td><code>経度</code></td><td>-180〜180</td></tr>
        <tr><td><code>null</code></td><td>欠損値 / 0とは区別</td></tr>
        <tr><td><code>状態</code></td><td>データセット固有の定義値</td></tr>
      </tbody></table></div>
    </section>

    <aside class="boundary-note"><span class="badge badge-neutral">許可リスト</span><span>公開マニフェストに記載した検証済みファイルのみ配信</span></aside>
  </main>
  <footer><a href="index.html">← 概要</a><a href="public_manifest.json">公開マニフェスト</a></footer>
  <script src="assets/site.js"></script>
</body>
</html>
