<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者画面 | MOSAdemy Monitor</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="brand"><span class="logo">M</span>MOSAdemy Monitor</div><nav class="nav"><a href="index.html">病院一覧</a><a class="active" href="admin.html">管理者画面</a></nav></header><main><div class="eyebrow">ADMINISTRATION</div><h1>施設管理</h1><p class="place">病院と設備を一元管理します。カメラ解析・針校正はここでは行いません。</p><div class="admin-actions"><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="export">施設設定JSONを書き出す</button><button id="publish" class="primary">GitHubへ施設設定を反映</button></div><button id="add" class="primary">＋ 病院を登録</button></div><section class="panel" style="margin-bottom:18px"><label>GitHubトークン（反映時だけ使用・保存しません）<input id="githubToken" type="password" autocomplete="off" placeholder="github_pat_..."></label><p class="small">通常は施設を編集して保存したあと「GitHubへ施設設定を反映」を1回押すだけです。<code>docs/data/facilities.json</code> を main にcommitします。</p></section><div id="notice" class="notice">燃料残量は設備種別「燃料残量」として登録し、施設ID＋設備IDで解析結果と自動対応します。</div><section class="panel table-wrap"><table class="admin-table"><thead><tr><th>施設ID</th><th>病院名</th><th>地域</th><th>設備数</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></main><div id="modal" class="modal"><div class="dialog"><h2>病院を編集</h2><div class="grid2"><label>施設ID *<input id="fid"></label><label>病院名 *<input id="fname"></label><label>都道府県<input id="pref"></label><label>市区町村<input id="city"></label></div><label>住所<input id="address"></label><div class="grid2"><label>緯度<input id="lat" type="number" step="any"></label><label>経度<input id="lon" type="number" step="any"></label><label>状態<select id="fstatus"><option value="normal">正常</option><option value="warning">要確認</option><option value="offline">オフライン</option></select></label></div><div class="section-head"><div><h3>設備</h3><p class="small">燃料残量は容量・単位・警告しきい値を登録します。解析設定は不要です。</p></div><button id="addDevice">＋ IDを追加</button></div><div id="deviceRows"></div><div class="dialog-footer"><button id="cancel">キャンセル</button><button id="save" class="primary">保存</button></div></div></div><script src="assets/admin.js"></script></body></html>
