<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>病院一覧 | MOSAdemy Monitor</title>
  <meta name="description" content="MOSAdemy施設モニタリング">
  <link rel="stylesheet" href="assets/app.css?v=20260728-2">
  <link rel="stylesheet" href="assets/sensor-types.css?v=20260728-2">
</head>
<body data-page="hospitals">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">M</span><span>MOSAdemy Monitor</span></a>
    <nav class="topnav" aria-label="メインナビゲーション">
      <a class="active" href="index.html">病院一覧</a>
      <a href="admin.html">管理者画面</a>
    </nav>
  </header>
  <main class="page-shell">
    <div class="page-heading">
      <div><p class="eyebrow">FACILITIES</p><h1>病院を探す</h1><p class="lead">登録病院の稼働状況と最新データを確認できます。</p></div>
      <div class="summary-pill"><span class="live-dot"></span><span id="syncText">データ取得中</span></div>
    </div>
    <section class="filter-panel" aria-label="病院の検索と絞り込み">
      <label class="search-field"><span>検索</span><input id="hospitalSearch" type="search" placeholder="病院名・施設ID・地域で検索"></label>
      <label><span>状態</span><select id="statusFilter"><option value="">すべて</option><option value="normal">正常</option><option value="warning">要確認</option><option value="offline">オフライン</option></select></label>
      <label><span>地域</span><select id="areaFilter"><option value="">すべての地域</option></select></label>
      <button id="clearFilters" class="button secondary" type="button">条件をクリア</button>
    </section>
    <div class="result-bar"><p><strong id="resultCount">0</strong> 件の病院</p><p class="muted">カードを選択すると管理ページを開きます</p></div>
    <section id="hospitalGrid" class="hospital-grid" aria-live="polite"></section>
    <div id="emptyState" class="empty-state" hidden><strong>該当する病院がありません</strong><p>検索条件を変更してください。</p></div>
  </main>
  <script src="assets/app.js?v=20260728-2"></script>
</body>
</html>
